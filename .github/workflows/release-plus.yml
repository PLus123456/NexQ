# NexQ Plus releases. `npm run release:plus` bumps the version, writes the
# CHANGELOG.plus.md entry and pushes a `plus-v<version>` tag; that tag builds
# the macOS app here and publishes it as a GitHub release, with the updater's
# latest.json, so installed copies update themselves.
#
# Run it by hand (Actions → Release NexQ Plus → Run workflow) to only build the
# current branch and keep the app as a workflow artifact, without a release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           updater key (~/.tauri/nexq-plus.key); required for a release
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty for a key made without one)
#   APPLE_CERTIFICATE                   optional: the Apple Development identity as a base64 .p12
#   APPLE_CERTIFICATE_PASSWORD          optional: the .p12's password
#   APPLE_SIGNING_IDENTITY              optional: the identity's name, e.g. "Apple Development: …"
# Without the Apple ones the app is signed ad hoc, and macOS asks again for the
# keychain and for microphone / screen recording access after every update.

name: Release NexQ Plus

on:
  push:
    tags:
      - "plus-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15 # Apple Silicon
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/plus-v') }}
    steps:
      - uses: actions/checkout@v7

      - name: Version and release notes
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" == "true" ]]; then
            if [[ "$GITHUB_REF_NAME" != "plus-v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
            {
              echo "notes<<__NOTES__"
              node scripts/release-plus.mjs --notes "$version"
              echo "__NOTES__"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Signing keys
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Only set what exists: Tauri treats an empty variable as a value.
          echo "BUNDLE_CONFIG=$RUNNER_TEMP/bundle.json" >> "$GITHUB_ENV"
          if [[ -n "$UPDATER_KEY" ]]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<__KEY__"
              echo "$UPDATER_KEY"
              echo "__KEY__"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > "$RUNNER_TEMP/bundle.json"
          elif [[ "$PUBLISH" == "true" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: a release without it gives installed apps no update."
            exit 1
          else
            echo "::warning::No updater key: building without update files."
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/bundle.json"
          fi
          if [[ -n "$APPLE_CERT" && -n "$APPLE_IDENTITY" ]]; then
            {
              echo "APPLE_CERTIFICATE<<__CERT__"
              echo "$APPLE_CERT"
              echo "__CERT__"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Signing with the Apple Development certificate."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::No Apple certificate: signing ad hoc."
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Same as upstream's release job: bump when the ggml/whisper build flags change.
          prefix-key: v1-ggml-portable

      - name: Install dependencies
        run: npm ci

      # libclang and the CMake generator for whisper.cpp.
      - name: macOS build environment
        shell: bash
        run: |
          source scripts/macos-env.sh
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=$CMAKE_GENERATOR" >> "$GITHUB_ENV"

      - name: Build and publish
        if: env.PUBLISH == 'true'
        uses: tauri-apps/tauri-action@v1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles app,dmg --config ${{ env.BUNDLE_CONFIG }}
          tagName: ${{ github.ref_name }}
          releaseName: "NexQ Plus ${{ steps.meta.outputs.version }}"
          releaseBody: ${{ steps.meta.outputs.notes }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

      - name: Build only
        if: env.PUBLISH != 'true'
        uses: tauri-apps/tauri-action@v1.0
        with:
          args: --bundles app,dmg --config ${{ env.BUNDLE_CONFIG }}

      - name: Keep the build
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nexq-plus-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz*
          if-no-files-found: error

      - name: Check the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir _verify --clobber
          cat _verify/latest.json
